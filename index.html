<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>道場工務系統</title>

<!-- 唔俾搜尋引擎收錄：呢個係道場內部工具，冇理由出現喺 Google 搜尋結果 -->
<meta name="robots" content="noindex, nofollow, noarchive">

<!-- ===== 加到主畫面（PWA）用 =====
     用絕對網址，所以喺 Apps Script 入面開都唔會 404。
     如果你改咗 GitHub 用戶名或 repo 名，記住連呢幾行一齊改。 -->
<link rel="manifest" href="https://hinl194.github.io/dojo-assets/manifest.json">
<link rel="apple-touch-icon" href="https://hinl194.github.io/dojo-assets/dojo-icon-180.png">
<link rel="icon" href="https://hinl194.github.io/dojo-assets/dojo-icon-192.png">
<meta name="theme-color" content="#1B3450">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="道場工務系統">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* 底部留白：iPhone 全螢幕會回報 34px（home indicator），
       瀏覽器同 Apps Script 回報 0，就用 12px 兜底。
       用 max() 唔用相加，先唔會兩者疊埋變雙倍。 */
    --safe-b:max(env(safe-area-inset-bottom, 0px), 20px);
    --nav-h:calc(38px + var(--safe-b));
    --paper:#F4F1E8;
    --card:#FDFCF8;
    --ink:#2A2722;
    --ink-soft:#6E675B;
    --ai:#27476E;
    --ai-deep:#1B3450;
    --shu:#B8432D;
    --matsu:#49714F;
    --line:#DCD5C4;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  /* ---------- 版面結構：header / main / nav 三段式 flex column ----------
     body 本身唔捲動，淨係 main 內部捲動。呢個係業界標準做法，
     可以徹底避開 iOS 全螢幕 PWA 入面 position:fixed 導覽同彈跳捲動
     互相干擾、令底部元素「浮走」嘅經典 bug —— 唔使再逐次補丁數值。 */
  html,body{height:100%;overflow:hidden}
  body{
    display:flex;flex-direction:column;
    font-family:'Noto Sans TC',sans-serif;background:var(--paper);color:var(--ink);
    font-size:15px;line-height:1.55;
  }
  h1,h2,h3{font-family:'Noto Serif TC',serif}

  /* ---------- 頁首（月相 logo） ---------- */
  header{
    background:var(--hdr-bg, #1B3450);color:#F2EFE6;
    /* 加到主畫面後係全螢幕，要預留返 iPhone 狀態列（時間／電量）嘅高度。
       喺瀏覽器同 Apps Script 入面 env() 係 0，所以行為唔變。 */
    padding:calc(env(safe-area-inset-top, 0px) + 11px) 18px 10px;
    display:flex;align-items:center;gap:12px;
  }
  /* 滿月：月亮喺左邊，所以左邊最光、向右漸暗；雲唔會出現 */
  .hdr-full{
    background:linear-gradient(90deg,
      var(--hdr-bg2) 0%, var(--hdr-bg) 62%, var(--hdr-bg) 100%);
  }
  .logo{
    /* 一組比例參數：改呢度就成個 logo 按比例縮放，月亮沒入雲嘅 1/6 唔會走樣 */
    --moon:20px; --cloud:60px; --lift:3px; --mtop:2px;
    --pfs:10px; --gap:2px; --driftX:-54px; --driftY:-22px;
    display:flex;flex-direction:column;align-items:center;gap:var(--gap);
    min-width:calc(var(--cloud) * 0.78);cursor:pointer;padding:2px 2px 1px;
  }
  .logo svg.moon{display:block;width:var(--moon);height:var(--moon)}
  /* top → 月亮下移，底部約 1/6 沒入雲中（唔影響版面高度） */
  #moonIcon{display:block;line-height:0;font-size:0;position:relative;top:var(--mtop)}
  header h1{font-size:19px;font-weight:700;letter-spacing:.14em}

  /* ----- 月相名 + 遮住佢嘅雲 ----- */
  .phase-wrap{position:relative;display:inline-block;line-height:1}
  .phase{
    font-size:var(--pfs);letter-spacing:.1em;white-space:nowrap;
    opacity:0;display:inline-block;            /* 平時完全收埋，撳月亮先出 */
  }
  .cloud{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%) translateY(calc(-1 * var(--lift)));
    width:var(--cloud);color:#8DA2BC;opacity:.92;
    pointer-events:none;display:block;
  }
  .cloud svg{display:block;width:100%}

  /* ----- 電腦滑鼠停留提示（觸控裝置唔會出） ----- */
  @media (hover:hover) and (pointer:fine){
    .logo{position:relative}
    .logo::after{
      content:'點一下試試看';
      position:absolute;top:100%;left:0;
      transform:translateY(5px);
      background:rgba(42,39,34,.94);color:#F2EFE6;
      font-size:11.5px;letter-spacing:.06em;padding:4px 10px;
      border-radius:6px;white-space:nowrap;
      opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:40;
    }
    .logo:hover::after{opacity:1}
    .hdr-lit .logo::after{content:'再撳一下收返'}
  }

  /* ----- 掃光：月亮 → 月相名 → 標題（左至右） ----- */
  #moonIcon,.cloud,header h1{
    transition:opacity .45s ease, text-shadow .45s ease,
               filter .45s ease, transform .7s ease;
  }
  .phase{transition:opacity .9s ease, text-shadow .9s ease, color .9s ease}
  .hdr-lit #moonIcon{filter:drop-shadow(0 0 3px rgba(242,239,230,.75));transition-delay:0s}
  .hdr-lit .cloud{
    transform:translate(-50%,-50%) translateY(calc(-1 * var(--lift)))
              translate(var(--driftX), var(--driftY)) rotate(-6deg);
    opacity:0;transition-delay:.10s;
  }
  .hdr-lit .phase{
    opacity:1;transition-delay:.10s;
    text-shadow:0 0 5px rgba(242,239,230,.8);
  }
  .hdr-lit h1{
    transition-delay:.22s;
    text-shadow:0 0 6px rgba(242,239,230,.6);
  }
  /* 新月：月亮本身冇光，所以唔發光 —— 底色全程唔變，只係名同月亮輪廓
     一齊隨雲開合（雲返嚟嗰陣，月亮輪廓都真係隱形，唔淨係俾雲遮住） */
  .hdr-new #moonIcon{opacity:0}
  .hdr-new.hdr-lit #moonIcon{opacity:1;filter:none}
  .hdr-new.hdr-lit .phase{
    opacity:.92;color:#8FA6C2;text-shadow:none;
  }
  .hdr-new.hdr-lit h1{text-shadow:none;opacity:.7}
  .hdr-new.hdr-lit .cloud{color:#54637A}
  .hdr-new.hdr-lit .hdr-user{opacity:.7}

  /* 變暗：標題 → 月相名 → 月亮（右至左） */
  .hdr-dim h1{transition-delay:0s}
  .hdr-dim .phase,.hdr-dim .cloud{transition-delay:.12s}
  .hdr-dim #moonIcon{transition-delay:.24s}

  /* 滿月：朵雲飄走之後就唔會再返嚟（動畫播完先加呢個 class） */
  .hdr-cloudless .cloud{
    transform:translate(-50%,-50%) translateY(calc(-1 * var(--lift)))
              translate(var(--driftX), var(--driftY)) rotate(-6deg);
    opacity:0;
  }

  /* ===== 大螢幕：logo 同字放大，27吋都睇得清月相 ===== */
  @media (min-width:820px){
    .logo{
      --moon:34px; --cloud:102px; --lift:5px; --mtop:2.1px;
      --pfs:15px; --gap:3px; --driftX:-92px; --driftY:-37px;
      padding:3px 3px 2px;
    }
    header{padding:calc(env(safe-area-inset-top, 0px) + 15px) 26px 13px;gap:16px}
    header h1{font-size:26px}
    .hdr-user{font-size:15px;gap:12px}
    .hdr-user .uid{font-size:13.5px}
    .hdr-user button{font-size:14px;padding:5px 13px}
    .logo::after{font-size:13px !important;padding:5px 12px !important}
    body{font-size:16px}
    main{max-width:860px;padding:20px 20px 8px}
    nav button{font-size:15px;padding:13px 0 11px}
    .section-label{font-size:13.5px}
    .card{padding:15px 16px}
    .card.stock .name{font-size:16px}
    .card.stock .meta{font-size:12px}
    .cnt-box button{width:40px;height:40px;font-size:20px}
    .cnt-box input{width:58px;font-size:18px}
    .chip-btn{font-size:14px;padding:7px 15px}
    .buy-head b{font-size:19px}
    .buy-row{font-size:15px}
    .savebar{max-width:860px;margin:0 auto;border-radius:10px 10px 0 0}
  }

  @media (prefers-reduced-motion:reduce){
    #moonIcon,.phase,.cloud,header h1{transition:none !important}
  }
  /* 頁首右邊：姓名 (會員編號) + 登出 */
  .hdr-user{
    margin-left:auto;display:flex;align-items:center;gap:9px;
    font-size:12.5px;color:#F2EFE6;min-width:0;
  }
  .hdr-user .nm{
    font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    cursor:pointer;border-bottom:1px dotted rgba(242,239,230,.5);padding-bottom:1px;
  }
  .hdr-user .uid{opacity:.7;font-size:11.5px}
  .hdr-user button{
    background:none;border:1px solid rgba(242,239,230,.45);border-radius:6px;
    color:#F2EFE6;font-size:12px;font-family:inherit;padding:3px 9px;
    cursor:pointer;white-space:nowrap;
  }
  .hdr-user button:active{background:rgba(242,239,230,.15)}

  main{
    flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    width:100%;max-width:640px;margin:0 auto;
    padding:14px calc(env(safe-area-inset-right, 0px) + 14px)
            22px calc(env(safe-area-inset-left, 0px) + 14px);
  }
  /* nav 唔顯示嗰陣（未登入／純會員），main 要自己頂埋底部 safe area */
  body.nav-hidden main{padding-bottom:calc(22px + var(--safe-b))}

  /* ---------- 分頁導覽 ----------
     正常排版佔位（唔再 position:fixed），永遠貼實螢幕最底，
     唔會再受彈跳捲動影響。 */
  nav{
    /* 高度定死做 --nav-h（同之前總高度一樣，靠佢定位嘅浮動掣唔使郁）。
       改用 align-items:center 令四個掣喺成個高度入面置中，等安全區
       上下平分，唔會成截淨係屈喺最底、睇落唔成比例。 */
    flex:0 0 auto;background:var(--card);
    border-top:1px solid var(--line);display:flex;align-items:center;
    z-index:20;height:var(--nav-h);
  }
  nav button{
    flex:1;background:none;border:none;padding:10px 0 8px;font-size:13px;
    color:var(--ink-soft);font-family:inherit;cursor:pointer;
    border-top:2.5px solid transparent;font-weight:500;
  }
  nav button.active{color:var(--ai);border-top-color:var(--ai);font-weight:700}
  /* 5 個掣（工務組先見到咁多）：收細少少先夠位 */
  nav.n5 button{font-size:12px;padding:10px 0 8px;min-width:0}

  .notice{
    background:#F6F2E4;border:1px solid #D8C99A;border-left:4px solid #B8912D;
    border-radius:var(--radius);padding:11px 13px;font-size:13px;
    color:var(--ink);line-height:1.6;
  }
  .notice b{color:#8A6A18}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--ink-soft);font-size:13.5px}
  .kv .v{font-weight:500}

  /* ---------- 通用 ---------- */
  .section-label{
    font-size:12.5px;letter-spacing:.22em;color:var(--ink-soft);
    margin:16px 2px 8px;display:flex;align-items:center;gap:8px;
  }
  .section-label::after{content:'';flex:1;height:1px;background:var(--line)}
  /* 組員貢獻嗰行右邊嘅「更新」細掣（貢獻有 5 分鐘 cache） */
  .contrib-refresh{
    flex:0 0 auto;background:none;border:1px solid var(--line);border-radius:6px;
    color:var(--ai);font-family:inherit;font-size:11.5px;letter-spacing:0;
    padding:3px 9px;cursor:pointer;
  }
  .contrib-refresh:active{background:var(--paper)}
  .contrib-refresh[disabled]{opacity:.5;cursor:default}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;margin-bottom:9px;
  }
  .duty{border-left:4px solid var(--ai);font-weight:500}
  .duty-top{display:flex;align-items:center;gap:9px}
  .duty-name{flex:1;min-width:0}
  .duty.undone{border-left-color:var(--shu);background:#FDF7F5}
  .duty-top.tap{cursor:pointer}
  .x-chip{
    color:var(--shu);font-weight:700;font-size:14px;
    border:1px solid var(--shu);border-radius:50%;
    width:19px;height:19px;line-height:17px;text-align:center;flex:0 0 auto;
  }
  .caret{color:var(--ink-soft);font-size:15px;transition:transform .2s ease;flex:0 0 auto}
  .caret.up{transform:rotate(180deg)}
  .duty-more{margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
  .due{font-size:12px;color:var(--ink-soft);margin-bottom:9px}
  .card.done{opacity:.62}
  .card.item button{margin-left:6px;flex:0 0 auto}
  .duty-more button{width:100%;padding:8px}
  .undone-box{
    background:#FBEDE9;border-radius:7px;padding:7px 10px;margin-bottom:9px;
    font-size:13px;font-weight:400;color:var(--shu);
  }
  .undone-box .who2{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
  .linkbtn{
    font-size:12px;color:var(--ai);border:1px solid var(--ai);border-radius:6px;
    padding:3px 9px;text-decoration:none;white-space:nowrap;font-weight:400;
  }
  .rollcall{
    display:block;text-align:center;background:var(--ai);color:#fff;
    padding:13px 16px;border-radius:var(--radius);text-decoration:none;
    font-size:16px;font-weight:500;letter-spacing:.08em;margin-bottom:6px;
  }
  .rollcall:active{background:var(--ai-deep)}
  .repairbtn{
    display:block;width:100%;text-align:center;
    background:var(--card);color:var(--ai);border:1px solid var(--ai);
    padding:11px 16px;border-radius:var(--radius);
    font-size:14.5px;font-weight:500;font-family:inherit;cursor:pointer;
    margin-bottom:14px;
  }
  .repairbtn:active{background:var(--paper)}
  .card.repair-form{margin-bottom:14px;border-color:var(--ai)}
  .login-hint{
    text-align:center;color:var(--ink-soft);font-size:13px;line-height:1.7;
    border:1px dashed var(--line);border-radius:var(--radius);
    padding:16px 14px;margin-top:16px;
  }
  .pin-tip{
    background:#F6F2E4;border:1px solid #D8C99A;border-radius:8px;
    padding:10px 12px;margin-top:10px;font-size:12.5px;line-height:1.75;color:var(--ink);
  }
  .pin-tip b{color:#8A6A18}
  /* 邏輯檢查結果 */
  .chk{border-radius:8px;padding:9px 11px;font-size:12.5px;margin:10px 0 2px;line-height:1.55}
  .chk b{display:block;margin-bottom:3px}
  .chk.good{background:#EAF0EA;border:1px solid #A9C0A9;color:var(--matsu)}
  .chk.warn{background:#F8F1DF;border:1px solid #D8C08A;color:#8A6A18}
  .chk.bad{background:#FBEDE9;border:1px solid var(--shu);color:var(--shu)}
  .chk-info{color:var(--ink-soft);margin-top:4px;font-size:11.5px}
  .duty.temp{border-left-color:var(--matsu)}
  .duty .tag{
    font-size:11px;color:var(--matsu);border:1px solid var(--matsu);
    border-radius:4px;padding:0 6px;white-space:nowrap;font-weight:400;
  }
  .duty .note{font-size:12.5px;color:var(--ink-soft);font-weight:400;margin-top:2px}

  /* ---------- 活動 ---------- */
  /* .duty 本身已經有左邊界，呢度淨係換色：紅＝要你回覆，綠＝答咗參加 */
  .card.evt.pending{border-left-color:var(--shu)}
  .card.evt.going{border-left-color:var(--matsu)}
  .duty .tag.ok{color:var(--matsu);border-color:var(--matsu)}
  /* 類別 pill 嘅顏色由 JS 落 inline style（類別數量可變，寫死唔到） */
  .duty .tag.cat{font-weight:500}
  .rsvp-row{display:flex;gap:8px;margin-top:10px}
  .rsvp-row button{flex:1}

  /* ---------- 日曆 ---------- */
  .cal-head{display:flex;align-items:center;gap:8px;margin:10px 0 8px}
  /* ⚠️ 一定要寫足 `button.ghost` —— 淨係寫 `.cal-head button` 嘅 specificity
     係 (0,1,1)，同上面 `button.ghost` 打和，而 button.ghost 排喺後面就會反
     過嚟贏，前後揀月個掣會縮返做 13.5px 細字，喺手機上面細到撳唔中。 */
  .cal-head button.ghost{
    flex:0 0 auto;min-width:64px;font-size:14px;line-height:1.2;
    padding:11px 8px;color:var(--ink);
  }
  .cal-title{
    flex:1;text-align:center;font-size:15px;font-weight:600;letter-spacing:.04em;
    padding:6px 0;cursor:pointer;
  }
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal-wd{text-align:center;font-size:11px;color:var(--ink-soft);padding:2px 0 4px}
  .cal-day{
    min-height:40px;background:var(--card);border:1px solid var(--line);
    border-radius:6px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:3px;font-size:13px;cursor:pointer;
    font-variant-numeric:tabular-nums;
  }
  .cal-day.empty{background:none;border-color:transparent;cursor:default}
  .cal-day.today{border-color:var(--ai);font-weight:700;color:var(--ai)}
  .cal-day.sel{background:var(--ai);border-color:var(--ai);color:#fff}
  /* 有活動嘅日子出彩色點（顏色 = 類別），最多 3 點 */
  .cal-dots{display:flex;align-items:center;gap:2px;height:6px}
  .cal-dot{width:5px;height:5px;border-radius:50%;display:block}
  .cal-more{font-size:9px;color:var(--ink-soft);line-height:1}
  .cal-day.sel .cal-more{color:#fff}
  /* 活動詳情：打橫排，唔夠位就成項跳落一行。
     ⚠️ 唔可以用 .kv —— 佢係 flex 一行一對，塞幾對入同一個就會逼到啲字直住排。 */
  .evt-kv{
    display:flex;flex-wrap:wrap;gap:5px 14px;
    padding:8px 0;margin-bottom:2px;border-bottom:1px solid var(--line);
  }
  .evt-kv > div{font-size:13px;white-space:nowrap}
  .evt-kv .k{color:var(--ink-soft);margin-right:5px}
  /* 回覆名單：會員編號行頭，同公家弓卡一樣嘅睇法 */
  .tag-row .multi b{color:var(--ai);font-weight:600;margin-right:4px}

  .empty{
    text-align:center;color:var(--ink-soft);padding:26px 10px;font-size:14px;
    border:1px dashed var(--line);border-radius:var(--radius);
  }

  button.primary{
    background:var(--ai);color:#fff;border:none;border-radius:8px;
    padding:11px 16px;font-size:15px;font-family:inherit;font-weight:500;
    width:100%;cursor:pointer;
  }
  button.primary:active{background:var(--ai-deep)}
  button.ghost{
    background:none;border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;font-size:13.5px;font-family:inherit;color:var(--ink-soft);cursor:pointer;
  }
  button.danger{
    background:none;border:1px solid var(--shu);border-radius:8px;color:var(--shu);
    padding:8px 12px;font-size:13.5px;font-family:inherit;cursor:pointer;
  }
  input,select,textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    font-size:15px;font-family:inherit;background:#fff;color:var(--ink);
  }
  /* iOS Safari 嘅 type="date" 撐闊過張卡。
     試過 max-width:100% 同 min-width:0 都攔唔住 —— 因為 iOS 個原生日期
     控件自己帶一套尺寸，width 系列規則根本管唔到佢。
     一定要先 -webkit-appearance:none 關咗 UA 樣式，之後 width 先生效。
     關咗之後個框變返普通方框，但撳落去照樣彈原生日期揀選器。 */
  input[type="date"]{
    -webkit-appearance:none;appearance:none;
    width:100%;max-width:100%;min-width:0;
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--ai);border-color:var(--ai)}
  label{font-size:13px;color:var(--ink-soft);display:block;margin:10px 0 4px}

  /* ---------- 物資 ---------- */
  .alert-banner{
    background:#FBEDE9;border:1px solid var(--shu);border-radius:var(--radius);
    padding:11px 13px;margin-bottom:12px;font-size:14px;
  }
  .alert-banner b{color:var(--shu)}
  .item{display:flex;align-items:center;gap:10px}
  .item .info{flex:1;min-width:0}
  .item .name{font-weight:500}
  .item .meta{font-size:12px;color:var(--ink-soft)}
  .qty{font-size:17px;font-weight:700;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
  .qty small{font-size:11px;font-weight:400;color:var(--ink-soft);margin-left:2px}
  .low .qty{color:var(--shu)}
  .low{border-left:4px solid var(--shu)}
  /* 需要購買清單 */
  .buy-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .buy-head b{font-size:17px;letter-spacing:.02em}
  .alert-banner{cursor:pointer}
  .alert-banner.open .buy-head b{font-size:14.5px}      /* 展開後細返，讓位俾清單 */
  .caret2{color:var(--shu);font-size:16px;transition:transform .2s ease;flex:0 0 auto}
  .caret2.up{transform:rotate(180deg)}
  .buy-list{margin-top:9px;padding-top:8px;border-top:1px solid rgba(184,67,45,.25);cursor:auto}
  .buy-row{
    display:flex;justify-content:space-between;gap:12px;
    padding:3px 0;font-size:13.5px;
  }
  .buy-row b{color:var(--shu);white-space:nowrap}
  .buy-sub{margin:0 0 5px 12px;padding-left:9px;border-left:2px solid rgba(184,67,45,.28)}
  .buy-sub div{
    display:flex;justify-content:space-between;gap:10px;
    font-size:12px;color:var(--ink-soft);padding:1px 0;
  }
  .multi{
    font-size:11px;color:var(--ink-soft);border:1px solid var(--line);
    border-radius:4px;padding:0 5px;margin-left:6px;font-weight:400;white-space:nowrap;
  }
  /* 一串標籤。.multi 本身有 margin-left，排成行嗰陣第一粒要收返。 */
  .tag-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .tag-row .multi{margin-left:0}
  /* 標籤揀選：同 .chips 唔同，呢度要換行唔要橫向捲，因為標籤數量會慢慢多 */
  .tag-pick{display:flex;flex-wrap:wrap;gap:6px}
  .tag-pick .chip-btn{flex:0 0 auto}
  /* ⚠️ 活動編輯器係喺展開咗嘅活動卡（.duty-more）入面 render，而嗰度有條
     `.duty-more button{width:100%}`，會將所有 chip 逼成一粒一行。
     呢條規則特異性較高（0,2,0 > 0,1,1），搶返嚟。 */
  .duty-more .chip-btn{width:auto}

  /* 搜尋 + 篩選 */
  .search{margin-bottom:9px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:7px;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chips.sub{padding-bottom:3px}
  .chip-btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    border-radius:20px;padding:5px 13px;font-size:13px;font-family:inherit;
    white-space:nowrap;cursor:pointer;flex:0 0 auto;
  }
  .chip-btn.on{background:var(--ai);color:#fff;border-color:var(--ai)}
  .chip-btn.warn{border-color:var(--shu);color:var(--shu)}
  .chip-btn.warn.on{background:var(--shu);color:#fff}
  .cnt2{color:var(--ink-soft);font-size:11px;letter-spacing:0}

  /* 物資卡（可即場加減） */
  /* 夠闊就自動變兩欄，窄芒維持一欄 */
  .stock-grid{
    display:grid;gap:9px;align-items:start;
    grid-template-columns:repeat(auto-fill, minmax(290px, 1fr));
  }
  .stock-grid .card{margin-bottom:0}
  .card.stock{padding:10px 11px}
  .stock-main{display:flex;align-items:center;gap:8px}
  .card.stock .info{flex:1;min-width:0}
  .card.stock .name{font-size:14.5px;line-height:1.35}
  .card.stock .meta{font-size:10.5px;line-height:1.45;margin-top:1px}
  .card.stock.editing{border-color:var(--ai);grid-column:1 / -1}
  .editbtn{
    background:none;border:1px solid var(--line);border-radius:7px;
    width:32px;height:32px;font-size:14px;color:var(--ai);
    cursor:pointer;flex:0 0 auto;padding:0;font-family:inherit;
  }
  .editbtn:active{background:var(--paper)}
  .item-editor{
    margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
  }
  .item-editor label{margin-top:8px}

  /* 類別排序 */
  .chip-btn.ord{border-style:dashed;color:var(--ai);border-color:var(--ai)}
  .ordpanel{margin-top:8px;border-color:var(--ai)}
  .ord-row{
    display:flex;align-items:center;gap:7px;padding:6px 0;
    border-bottom:1px solid var(--line);
  }
  .ord-row:last-of-type{border-bottom:none}
  .ord-row span{flex:1;font-size:14px}
  .ord-row button{
    width:36px;height:32px;border:1px solid var(--line);background:#fff;
    border-radius:7px;cursor:pointer;font-size:14px;color:var(--ink);padding:0;
  }
  .ord-row button:disabled{opacity:.3;cursor:default}
  .card.stock.changed{
    border-color:var(--ai);background:#DCE7F4;
  }
  .card.stock.changed .name{color:var(--ai-deep)}
  .card.stock.changed .cnt-box input{border-color:var(--ai);color:var(--ai-deep)}
  .cnt-box{display:flex;align-items:center;gap:4px;flex:0 0 auto}
  .cnt-box button{
    width:34px;height:34px;font-size:18px;border:1px solid var(--line);
    background:#fff;border-radius:8px;cursor:pointer;color:var(--ink);padding:0;
  }
  .cnt-box button:active{background:var(--paper)}
  .cnt-box input{
    width:48px;text-align:center;font-size:16px;font-weight:700;
    padding:6px 2px;font-variant-numeric:tabular-nums;
  }
  .cnt-box .unit{font-size:11px;color:var(--ink-soft);width:20px}

  /* 儲存列（有改動先出現） */
  .savebar{
    position:fixed;left:0;right:0;
    bottom:var(--nav-h);   /* 浮喺 nav 上面；nav 而家係正常排版，呢個位置仍然啱 */
    display:none;gap:8px;padding:9px 14px;z-index:25;
    background:rgba(253,252,248,.97);border-top:1px solid var(--line);
  }
  .savebar.show{display:flex}
  body.has-savebar main{padding-bottom:calc(var(--nav-h) + 78px)}
  .savebar button{flex:1;padding:11px;border-radius:8px;font-family:inherit;font-size:15px;cursor:pointer}
  .savebar .ghost{flex:0 0 88px;border:1px solid var(--line);background:#fff;color:var(--ink-soft)}
  .savebar .primary{background:var(--ai);color:#fff;border:none;font-weight:500}

  /* ---------- 維修 ---------- */
  .chip{display:inline-block;font-size:12px;border-radius:20px;padding:2px 10px;font-weight:500}
  .chip.s0{background:#FBEDE9;color:var(--shu)}
  .chip.s1{background:#EDF0E4;color:#7A6A20}
  .chip.s2{background:#E8EFE8;color:var(--matsu)}
  .repair-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .repair-item{font-weight:700}
  .repair-desc{margin:5px 0 3px}
  .repair-meta{font-size:12px;color:var(--ink-soft)}
  .status-btns{display:flex;gap:7px;margin-top:10px}
  .status-btns button{flex:1;padding:8px 4px;font-size:13px;border-radius:8px;border:1px solid var(--line);background:#fff;font-family:inherit;cursor:pointer}
  .status-btns button.on{background:var(--ai);color:#fff;border-color:var(--ai)}

  /* ---------- 保養回報 ---------- */
  .svc-card .svc-prog{
    font-size:12px;color:var(--ink-soft);margin-right:8px;
    font-variant-numeric:tabular-nums;
  }
  .svc-day{
    font-size:12px;color:var(--ink-soft);letter-spacing:.1em;
    margin:10px 2px 6px;
  }
  .svc-day:first-child{margin-top:2px}
  .svc-bows{display:flex;flex-wrap:wrap;gap:7px}
  .svc-bow{
    border:1px solid var(--ai);color:var(--ai);background:var(--card);
    border-radius:8px;padding:7px 13px;font-size:14.5px;font-weight:700;
    font-family:inherit;font-variant-numeric:tabular-nums;cursor:pointer;
  }
  .svc-bow:active{background:var(--paper)}
  .svc-bow.active{
    background:var(--ai);color:#F2EFE6;border-color:var(--ai);
    box-shadow:0 2px 8px rgba(27,52,80,.25);
  }
  .svc-bow.done{
    border-color:var(--line);color:var(--matsu);background:transparent;
    cursor:default;font-weight:400;
  }
  .svc-hint{font-size:11.5px;color:var(--ink-soft);margin-top:10px}
  .svc-form{
    margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
  }
  .svc-item{
    display:flex;align-items:center;gap:9px;padding:7px 2px;
    font-size:14px;cursor:pointer;margin:0;
  }
  .svc-item input{width:auto;margin:0}
  textarea#annBox{width:100%;font-family:inherit;line-height:1.5;resize:vertical}

  .langbtn{
    font-size:11.5px;letter-spacing:.06em;padding:4px 8px;
    min-width:32px;opacity:.85;
  }

  .act-count{
    font-size:11.5px;color:var(--ai);font-weight:700;
    letter-spacing:.05em;margin-bottom:2px;
  }
  .promo-row{
    display:flex;align-items:center;gap:8px;
    padding:4px 2px;border-bottom:1px solid var(--line);
  }
  .promo-row:last-of-type{border-bottom:none}
  .promo-row.on{background:rgba(27,52,80,.05);border-radius:8px;padding-left:6px}
  .promo-row .svc-item{margin:0}

  /* ---------- 回到最頂 ---------- */
  #toTop{
    position:fixed;right:14px;z-index:30;
    bottom:calc(var(--nav-h) + 14px);
    width:42px;height:42px;border-radius:50%;
    background:var(--card);color:var(--ai);
    border:1px solid var(--line);box-shadow:0 3px 12px rgba(42,39,34,.16);
    font-size:17px;line-height:1;cursor:pointer;
    display:none;align-items:center;justify-content:center;
    padding:0;
  }
  body.nav-hidden #toTop{bottom:calc(var(--safe-b) + 14px)}
  #toTop.show{display:flex}

  /* ---------- 強化警告框 ---------- */
  .warnbox{
    background:#FFF4E2;border:1.5px solid var(--shu);
    border-left-width:5px;border-radius:var(--radius);
    padding:13px 15px;margin-bottom:12px;
  }
  .warnbox-head{
    font-family:'Noto Serif TC',serif;font-weight:700;font-size:15.5px;
    color:var(--shu);letter-spacing:.04em;margin-bottom:8px;
  }
  .warnbox-hit{
    background:var(--shu);color:#FFF8EE;
    font-size:14.5px;font-weight:700;line-height:1.55;
    padding:9px 12px;border-radius:8px;margin-bottom:9px;
  }
  .warnbox-hit u{text-underline-offset:3px}
  .warnbox-body{font-size:13.5px;line-height:1.65;color:var(--ink)}

  /* ---------- 會員名單 ---------- */
  .card.item.mem{flex-wrap:wrap}
  .card.item.mem.off{opacity:.55}
  .card.item.mem.dirty{border-color:var(--ai);border-left-width:3px}
  .mem-editor{
    flex:1 0 100%;margin-top:10px;padding-top:11px;
    border-top:1px solid var(--line);
  }
  .mem-editor label{margin-top:10px}
  .mem-editor label:first-child{margin-top:0}
  .savebar-inline{
    position:sticky;bottom:6px;display:flex;gap:8px;margin-top:12px;
    background:var(--paper);padding:8px 0;
  }
  .savebar-inline .primary{flex:1}

  .gradebox{
    width:115px;flex:0 0 auto;font-size:13.5px;padding:7px 6px;
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    font-family:inherit;color:var(--ink);cursor:pointer;
  }

  /* ---------- 公家弓 ---------- */
  .bow-grid{
    display:grid;gap:8px;align-items:start;
    grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));
  }
  .bow-grid .card{margin-bottom:0}
  .card.bow{padding:0;overflow:hidden}
  .bow-main{display:flex;align-items:center;gap:9px;padding:10px 11px;cursor:pointer}
  .bow-no{
    font-size:17px;font-weight:700;color:var(--ai);
    font-variant-numeric:tabular-nums;flex:0 0 auto;
  }
  .bow-info{flex:1;min-width:0}
  .bow-brand{font-size:14px;line-height:1.3}
  .bow-meta{font-size:11px;color:var(--ink-soft);margin-top:1px}
  .card.bow.picked{border-color:var(--ai);grid-column:1 / -1}
  .card.bow.due .bow-no{color:var(--shu)}
  .card.bow.off{opacity:.5}
  .card.bow.off .bow-no{color:var(--ink-soft)}
  .bow-panel{padding:0 11px 12px;border-top:1px solid var(--line);margin-top:2px}
  .bow-panel label{margin-top:10px}
  .bow-ops{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
  .bow-stat{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:9px}
  .bow-stat b{color:var(--ink)}

  /* ---------- 最近事項 ---------- */
  .ver{
    text-align:center;font-size:10px;color:var(--ink-soft);
    opacity:.45;letter-spacing:.1em;margin-top:18px;
  }
  .day-sep{
    font-size:11.5px;color:var(--ink-soft);letter-spacing:.16em;
    margin:12px 2px 6px;
  }
  .card.act{display:flex;gap:9px;align-items:flex-start;padding:9px 11px}
  .act-tag{
    font-size:11px;border-radius:5px;padding:2px 7px;white-space:nowrap;
    flex:0 0 auto;margin-top:1px;
  }
  .act-tag.a-warn{background:#FBEDE9;color:var(--shu)}
  .act-tag.a-done{background:#E8EFE8;color:var(--matsu)}
  .act-tag.a-norm{background:#EDF1F7;color:var(--ai)}
  .act-body{flex:1;min-width:0}
  .act-detail{font-size:13.5px;line-height:1.45;word-break:break-word}
  /* 重複次數（「劉子軒 ×6」）—— 淡啲，唔好搶走個名 */
  .act-detail .xn{color:var(--ink-soft);font-size:12px;font-variant-numeric:tabular-nums}
  .act-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
  /* 日常紀錄：暗色細字，唔搶眼 */
  .routine{margin-top:14px}
  .routine>summary{
    font-size:13px;color:var(--ink-soft);font-weight:400;
    display:flex;align-items:center;gap:7px;padding:7px 2px;
  }
  .routine .rn{
    font-size:11px;background:var(--line);color:var(--ink-soft);
    border-radius:10px;padding:0 7px;
  }
  .card.act.dim{
    opacity:.72;padding:7px 10px;background:transparent;
    border-style:dashed;
  }
  .card.act.dim .act-detail{font-size:12.5px}
  .card.act.dim .act-tag{font-size:10px;padding:1px 6px}
  .routine .day-sep{margin:9px 2px 5px;font-size:11px}

  /* ---------- 統計 ---------- */
  .rank{display:flex;align-items:center;gap:12px}
  .rank .pos{font-family:'Noto Serif TC',serif;font-weight:700;font-size:17px;color:var(--ai);width:26px;text-align:center}
  .rank .bar-wrap{flex:1}
  .rank .bar{height:6px;background:var(--ai);border-radius:3px;margin-top:5px;opacity:.85}
  .rank .cnt{font-weight:700;font-variant-numeric:tabular-nums}

  /* ---------- 工作表 ---------- */
  table.rota{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  table.rota th,table.rota td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  table.rota th{font-size:12px;color:var(--ink-soft);font-weight:500;letter-spacing:.08em}
  table.rota tr:last-child td{border-bottom:none}
  table.rota td.freq{white-space:nowrap;color:var(--ai);font-size:12.5px}
  table.rota td.yotei{color:var(--ink-soft);font-size:12.5px}
  .edit-row{display:flex;gap:8px;margin-top:10px}
  .edit-row button{flex:1}
  .rota-no{font-size:11.5px;color:var(--ink-soft);letter-spacing:.1em;margin-bottom:6px}
  /* 予定組合器 */
  .tog{display:flex;flex-wrap:wrap;gap:6px}
  .tog button{
    padding:8px 0;min-width:40px;border:1px solid var(--line);background:#fff;
    border-radius:7px;font-size:14px;font-family:inherit;cursor:pointer;color:var(--ink);
  }
  .tog button.on{background:var(--ai);color:#fff;border-color:var(--ai)}
  .tog.wk button{min-width:52px;font-size:12.5px;padding:7px 6px}
  .tog.wk button.on{background:var(--matsu);border-color:var(--matsu);color:#fff}
  .rule{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:#FBF9F2}
  .rule-hd{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink-soft);margin-bottom:7px;letter-spacing:.1em}
  .rule-hd button{background:none;border:none;color:var(--shu);font-size:12px;cursor:pointer;font-family:inherit;padding:0}
  .preview{
    background:#EDF1F7;border:1px solid #C7D2E1;border-radius:8px;
    padding:9px 11px;font-size:13px;margin:12px 0 4px;color:var(--ai-deep);word-break:break-all;
  }
  .preview .lbl{font-size:10.5px;color:var(--ink-soft);letter-spacing:.14em;display:block;margin-bottom:3px}
  .row-compact{display:flex;align-items:center;gap:10px;cursor:pointer}
  .row-compact .info{flex:1;min-width:0}
  .row-compact .nm2{font-weight:500}
  .row-compact .sub2{font-size:12px;color:var(--ink-soft);margin-top:1px}
  .row-compact .arw{color:var(--ai);font-size:15px}

  details summary{cursor:pointer;font-size:14px;color:var(--ai);padding:6px 2px;font-weight:500}
  .toast{
    position:fixed;bottom:86px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;
    font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;
    max-width:88%;text-align:center;
  }
  .toast.show{opacity:1}
  .loading{text-align:center;color:var(--ink-soft);padding:30px 0}
  .loading::before{content:'◐';display:inline-block;animation:spin 1s linear infinite;margin-right:8px;color:var(--ai)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.loading::before{animation:none}}
</style>
</head>
<body>

<header id="appHeader">
  <div class="logo" id="moonBtn" onclick="showMoonInfo()" title="撳一下睇今日月相" role="button" tabindex="0">
    <span id="moonIcon"></span>
    <span class="phase-wrap">
      <span class="phase" id="phaseName"></span>
      <span class="cloud" aria-hidden="true"><svg viewBox="0 0 74 28" xmlns="http://www.w3.org/2000/svg"><g fill="currentColor"><ellipse cx="25" cy="12" rx="14" ry="9"/><ellipse cx="11" cy="18.5" rx="9" ry="5.8"/><ellipse cx="41" cy="15" rx="10.5" ry="6.8"/><ellipse cx="54" cy="18.5" rx="8" ry="4.8"/><ellipse cx="64" cy="20.5" rx="5.5" ry="3.2"/><rect x="7" y="16" width="60" height="8" rx="4"/></g></svg></span>
    </span>
  </div>
  <h1 id="appName">道場工務系統</h1>
  <div class="hdr-user" id="hdrUser"></div>
</header>

<main id="main"><div class="loading">載入中</div></main>

<nav id="nav"></nav>
<button id="toTop" title="回到最頂" aria-label="回到最頂">↑</button>

<div class="toast" id="toast"></div>

<script>
var APP_VERSION = 'v53';

/* ============ 狀態 ============ */
var state = {
  tab: 'today',
  auth: null,
  publicData: null,
  ops: null,
  buyOpen: false,       // 「需要購買」展開咗未（預設收起）
  recentAll: false,     // 最近事項展開晒未
  routineOpen: false,   // 日常紀錄展開咗未
  itemEdit: null,       // 正在編輯邊張物資卡（副組長以上）
  catOrderOpen: false,  // 類別排序面板開咗未
  catOrderDraft: null,  // 排緊嘅類別次序
  stockQ: '',           // 物資搜尋字串
  stockFilter: '',      // '' | 'low' | 點算類型
  stockCat: '',         // 類別篩選
  pending: {},          // 未儲存嘅物資數量改動 {編號: 數量}
  rotaOpen: false,      // 工作表 details 開咗未

/* ★★★ 要填呢一行 ★★★
   填 Apps Script 部署嗰條 …/exec 網址。
   喺 Apps Script 入面開個 app 嗰陣，呢個值會被自動忽略，
   所以同一份檔案可以同時做 Apps Script 版同 GitHub Pages 版。 */
var API_URL = 'https://script.google.com/macros/s/AKfycbxxybJJrSbZvk05xfpVYQrkGNCevwB7tG2j5KsLWbx7IJPXx_yF4GHNWRWtyRvrZj8r/exec';

function inAppsScript() {
  return !!(typeof google !== 'undefined' && google.script && google.script.run);
}

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);

  // ── 入口一：喺 Apps Script 入面（同以前一模一樣）
  if (inAppsScript()) {
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (err) { reject(err); });
      runner[fn].apply(runner, args);
    });
  }

  // ── 入口二：喺 GitHub Pages（或其他地方）→ 打 JSON 介面
  if (!API_URL) {
    return Promise.reject(new Error(
      '未設定 API_URL：請喺 Index.html 頂部填返 Apps Script 嘅 /exec 網址'));
  }
  return fetch(API_URL, {
    method: 'POST',
    // 用 text/plain 係關鍵：避開瀏覽器預檢請求，因為 Apps Script 改唔到回應標頭
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args })
  }).then(function (r) {
    if (!r.ok) throw new Error('伺服器回應 ' + r.status);
    return r.json();
  }).then(function (d) {
    if (!d.ok) throw new Error(d.error || '未知錯誤');
    return d.result;
  });
}
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.classList.remove('show'); }, 2600);
}

/* ============ 月相圖示 ============ */
/**
 * p: 0=新月 0.25=上弦 0.5=滿月 0.75=下弦
 * 北半球（香港）：漸盈時亮右邊，漸虧時亮左邊
 */
function moonSvg(p, size, tilt) {
  var r = size / 2 - 1, cx = size / 2, cy = size / 2;
  var a = r * Math.cos(2 * Math.PI * p);          // 明暗界線橢圓嘅橫半軸
  var illum = (1 - Math.cos(2 * Math.PI * p)) / 2;
  var lit;
  if (illum < 0.015) {
    // 新月：冇亮面，畫一個實心但暗淡嘅月盤（同月相說明圖一致）
    lit = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r +
      '" fill="currentColor" opacity="0.30"/>';
  } else if (illum > 0.985) {
    lit = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="currentColor"/>';
  } else {
    /* 亮邊永遠先畫喺右邊（tilt = 0 嘅基準方向），再交俾下面嘅 rotate 擺去真實方向。
       ⚠️ 唔可以喺呢度按盈/虧再翻轉左右 —— tilt 本身已經包含咗亮邊指向邊，
       兩者一齊做就會翻轉兩次，虧月會畫反。 */
    var semiSweep = 1;                            // 右半圓＝亮邊外緣
    var termSweep = (a > 0) ? 0 : 1;              // 蛾眉月界線向右鼓，凸月向左鼓
    lit = '<path d="M ' + cx + ' ' + (cy - r) +
      ' A ' + r + ' ' + r + ' 0 0 ' + semiSweep + ' ' + cx + ' ' + (cy + r) +
      ' A ' + Math.abs(a).toFixed(2) + ' ' + r + ' 0 0 ' + termSweep + ' ' + cx + ' ' + (cy - r) +
      ' Z" fill="currentColor"/>';
  }
  var rot = Number(tilt) || 0;
  return '<svg class="moon" width="' + size + '" height="' + size + '" viewBox="0 0 ' +
    size + ' ' + size + '" aria-hidden="true">' +
    '<g transform="rotate(' + rot.toFixed(1) + ' ' + cx + ' ' + cy + ')">' +
    lit + '</g></svg>';
}
function renderMoon() {
  var m = state.publicData && state.publicData.moon;
  if (!m) return;
  document.getElementById('moonIcon').innerHTML = moonSvg(m.phase, 20, m.tilt);
  document.getElementById('phaseName').textContent = m.name;

  var hdr = document.getElementById('appHeader');

  /* 底色跟光照度微調：月光越足，夜空越淺（幅度好細，唔會搶眼） */
  var t = Math.max(0, Math.min(1, (m.illum || 0) / 100));
  var dark = [21, 40, 61], bright = [33, 62, 95];
  var base = dark.map(function (v, i) { return Math.round(v + (bright[i] - v) * t); });
  hdr.style.setProperty('--hdr-bg', 'rgb(' + base.join(',') + ')');
  hdr.style.setProperty('--hdr-bg2',
    'rgb(' + base.map(function (v) { return Math.min(255, Math.round(v * 1.5 + 10)); }).join(',') + ')');

  hdr.classList.toggle('hdr-new', m.name === '新月');
  hdr.classList.toggle('hdr-full', m.name === '滿月');

  /* 滿月／新月：一開網頁自動播一次動畫，之後月相名（新月連埋月亮輪廓）照常淡出 */
  if ((m.name === '滿月' || m.name === '新月') && !state.moonIntroPlayed) {
    state.moonIntroPlayed = true;
    setTimeout(function () { showMoonInfo(); }, 450);
  }
  var btn = document.getElementById('moonBtn');
  btn.setAttribute('aria-label', '今日月相：' + m.name + '，光照 ' + m.illum + '%' +
    (m.visible ? '，月亮喺地平線上' : '，月亮而家喺地平線下'));
}
/* 撳月亮 → 雲飄走，月光由左至右照亮（月亮→月相名→標題），
   幾秒後由右至左暗返 */
var moonTimers = {};
function showMoonInfo() {
  var hdr = document.getElementById('appHeader');
  if (!hdr || !(state.publicData && state.publicData.moon)) return;
  clearTimeout(moonTimers.dim);
  clearTimeout(moonTimers.clr);
  if (hdr.classList.contains('hdr-lit')) { dimHeader(); return; }
  hdr.classList.remove('hdr-dim');
  hdr.classList.add('hdr-lit');
  moonTimers.dim = setTimeout(dimHeader, 4500);
}
function dimHeader() {
  var hdr = document.getElementById('appHeader');
  if (!hdr) return;
  clearTimeout(moonTimers.dim);
  // 滿月：雲飄走咗就唔好返嚟
  if (hdr.classList.contains('hdr-full')) hdr.classList.add('hdr-cloudless');
  hdr.classList.add('hdr-dim');      // 反方向嘅延遲
  hdr.classList.remove('hdr-lit');
  moonTimers.clr = setTimeout(function () { hdr.classList.remove('hdr-dim'); }, 1100);
}

  ['bow',   'tabBow',    'member'],
  ['stock', 'tabStock',  'ops'],
  ['stats', 'tabReport', 'report']   // 含導師
];
function visibleTabs() {
  return TABS_IN.filter(function (tb) {
    if (tb[2] === 'member') return true;
    if (tb[2] === 'ops')    return isOps();
    if (tb[2] === 'report') return isReport();
    return false;
  });
}

function renderNav() {
  var nav = document.getElementById('nav');

  // 未登入：只有今日工作（＋登入），唔使底部導覽
  if (!state.auth) {
    if (['login', 'me'].indexOf(state.tab) === -1) state.tab = 'today';
    nav.innerHTML = '';
    nav.style.display = 'none';
    document.body.classList.add('nav-hidden');   // main 自己頂返 safe area
    return;
  }

  nav.style.display = 'flex';
  document.body.classList.remove('nav-hidden');
  var tabs = visibleTabs();
  // 'me' 冇底部掣，但係合法頁面
  var valid = tabs.some(function (tb) { return tb[0] === state.tab; }) || state.tab === 'me';
  if (!valid) state.tab = 'today';
  /* 工務組會見到 5 個掣（會員 3 個、導師 4 個）。掣係 flex:1 平分，
     5 個嗰陣要收細字先夠位。 */
  nav.className = tabs.length >= 5 ? 'n5' : '';
  nav.innerHTML = tabs.map(function (tb) {
    return '<button data-tab="' + tb[0] + '"' + (tb[0] === state.tab ? ' class="active"' : '') +
      '>' + esc(t(tb[1])) + '</button>';
  }).join('');
  document.querySelectorAll('#nav button').forEach(function (b) {
    b.addEventListener('click', function () { state.tab = b.dataset.tab; render(); });
  });
}

var _lastTab = null;
function render() {
  // 換頁就捲返最頂（唔係換頁就唔郁，避免打斷編輯）
  if (state.tab !== _lastTab) {
    _lastTab = state.tab;
    var mb = document.getElementById('main');
    if (mb) mb.scrollTop = 0;
    var tt = document.getElementById('toTop');
    if (tt) tt.classList.remove('show');
  }
  if (state.tab !== 'stock') document.body.classList.remove('has-savebar');
  renderNav();
  renderMoon();
  renderHdrUser();
  if (state.tab === 'login') return renderLogin();
  if (state.tab === 'today') return renderToday();
  if (!state.auth) return renderLogin();
  if (state.tab === 'me') return renderMe();
  if (state.tab === 'cal') return renderCal();   // ⚠️ 一定要喺下面個 isOps 閘之前
  if (state.tab === 'bow') return renderBow();   // 會員以上都用得
  if (state.tab === 'stats' && isReport()) {     // 導師可以睇報告
    if (!state.ops) return isOps() ? loadOps() : loadReport();
    return renderStats();
  }
  if (!isOps()) return renderToday();      // 其餘功能需要工務組
  if (!state.ops) return loadOps();
  if (state.tab === 'stock') return renderStock();
  if (state.tab === 'stats') return renderStats();
}

/* 頁首右邊：未登入 → 登入掣；已登入 → 姓名 (會員編號) + 登出 */
function langBtn() {
  var other = state.lang === 'en' ? 'zh' : 'en';
  return '<button class="langbtn" onclick="setLang(\'' + other + '\')" ' +
    'title="' + (other === 'en' ? 'English' : '中文') + '">' +
    (other === 'en' ? 'EN' : '中') + '</button>';
}

function renderHdrUser() {
  var box = document.getElementById('hdrUser');
  if (!state.auth) {
    box.innerHTML = langBtn() + ((state.tab === 'login')
      ? '<button onclick="closeLogin()">' + t('back').replace('← ', '') + '</button>'
      : '<button onclick="openLogin()">' + t('login') + '</button>');
    return;
  }
  box.innerHTML = langBtn() +
    '<span class="nm" onclick="openMe()">' + esc(state.auth.name) +
    ' <span class="uid">(' + esc(state.auth.id) + ')</span></span>' +
    '<button onclick="logout()">' + t('logout') + '</button>';
}
function openMe() { state.tab = 'me'; render(); }
function openLogin() { state.tab = 'login'; render(); }
function closeLogin() { state.tab = 'today'; render(); }

/* ============ 今日工作（公開） ============ */
function renderToday() {
  if (!state.publicData) {
    main().innerHTML = '<div class="loading">載入中</div>';
    call('getPublicData').then(function (d) {
      state.publicData = d;
      renderMoon();
      if (state.tab === 'today') renderToday();
    }).catch(function (e) {
      main().innerHTML = '<div class="empty">載入失敗：' + esc(e.message) +
        '<br><br><button class="ghost" onclick="state.publicData=null;renderToday()">重試</button></div>';
    });
    return;
  }
  var d = state.publicData;
  var h = '';

  /* 點名按鈕（頂部） */
  var st = d.settings || {};
  if (state.auth && st.rollCallUrl) {
    h += '<a class="rollcall" href="' + esc(st.rollCallUrl) + '" target="_blank" rel="noopener">' +
      esc(st.rollCallLabel || t('rollCall')) + ' ↗</a>';
  } else if (isLeader()) {
    h += '<div class="empty" style="margin-bottom:10px;padding:14px">' +
      '未設定點名連結<br><button class="ghost" style="margin-top:8px" onclick="openSettings()">去設定</button></div>';
  }

  /* 報維修（組員以上） */
  if (isReport()) {
    h += '<button class="repairbtn" onclick="toggleRepairForm()">' + t('reportRepair') +
      (state.repairFormOpen ? ' ✕' : '') + '</button>';
    if (state.repairFormOpen) h += repairFormCard();
  }

  /* 活動（要登入先見到）*/
  if (state.auth) h += eventsSection();

  /* 公家弓檢查維修卡（有排程未完成先出現；要登入先見到） */
  if (state.auth && d.schedule && !d.schedule.complete) {
    var sch = d.schedule;
    var total = 0, done = 0;
    sch.days.forEach(function (dd) { dd.bows.forEach(function (b) { total++; if (b.done) done++; }); });
    var open = state.svcCardOpen;
    h += '<div class="card duty svc-card' + (open ? ' open' : '') + '">' +
      '<div class="duty-head" onclick="toggleSvcCard()">' +
      '<span class="duty-name">' + t('bowCheck') + '</span>' +
      '<span class="svc-prog">' + done + '/' + total + '</span>' +
      '<span class="caret' + (open ? ' up' : '') + '">⌄</span></div>';
    if (open) {
      h += '<div class="duty-body" onclick="event.stopPropagation()">';
      sch.days.forEach(function (dd) {
        h += '<div class="svc-day">' + esc(String(dd.date).replace(/ .*$/, '')) + '</div><div class="svc-bows">';
        dd.bows.forEach(function (b) {
          if (b.done) {
            h += '<span class="svc-bow done">' + esc(b.id) + ' ✓</span>';
          } else {
            h += '<button class="svc-bow' + (state.svcBow === b.id ? ' active' : '') +
              '" onclick="openSvc(\'' + esc(b.id) + '\',\'today\')">' +
              esc(b.id) + '</button>';
          }
        });
        h += '</div>';
      });
      if (state.svcBow) h += svcForm(state.svcBow);
      h += '<p class="svc-hint">' + t('svcHint') + '</p></div>';
    }
    h += '</div>';
  }

  h += '<div class="section-label">' + t('todayPrefix') + esc(d.todayName) + '</div>';

  if (!d.todayDuties.length) {
    h += '<div class="empty">' + t('noDuty') + '</div>';
  } else {
    d.todayDuties.forEach(function (r, i) { h += dutyCard(r, i); });
  }

  if (state.auth) {
    h += '<details id="rotaDetails"' + (state.rotaOpen ? ' open' : '') + ' style="margin-top:14px">' +
      '<summary>' + t('fullRota') + '</summary><div id="rotaBody"></div></details>';
  } else {
    h += '<div class="login-hint">' + t('todayLoginHint') + '<br>' +
      '<button class="ghost" style="margin-top:9px" onclick="openLogin()">' + t('login') + '</button></div>';
  }
  h += '<div class="ver">' + APP_VERSION + '</div>';
  main().innerHTML = h;

  if (state.auth) {
    document.getElementById('rotaDetails').addEventListener('toggle', function () {
      state.rotaOpen = this.open;
    });
    renderRota();
  }
}

/* ---------- 單張工作卡（預設簡潔，撳一下先展開） ---------- */
function dutyCard(r, i) {
  var undone = r.status === '未能完成';
  var tappable = !!(state.auth || undone);
  var open = state.dutyOpen === i;

  var h = '<div class="card duty' + (r.oneoff ? ' temp' : '') + (undone ? ' undone' : '') + '">' +
    '<div class="duty-top' + (tappable ? ' tap' : '') + '"' +
    (tappable ? ' onclick="toggleDuty(' + i + ')"' : '') + '>' +
    '<div class="duty-name">' + esc(r.item) +
    (r.oneoff && r.note ? '<div class="note">' + esc(r.note) + '</div>' : '') + '</div>' +
    (undone ? '<span class="x-chip">✗</span>' : '') +
    (r.oneoff ? '<span class="tag">臨時</span>' : '') +
    (state.auth && r.link
      ? '<a class="linkbtn" href="' + esc(r.link) + '" target="_blank" rel="noopener" ' +
        'onclick="event.stopPropagation()">開啟 ↗</a>' : '') +
    (tappable ? '<span class="caret' + (open ? ' up' : '') + '">⌄</span>' : '') +
    '</div>';

  if (open) {
    h += '<div class="duty-more">';
    if (undone) {
      h += '<div class="undone-box">今日未能完成' + (r.reason ? '：' + esc(r.reason) : '') +
        '<div class="who2">' + esc(r.by) + ' · ' + esc(String(r.at).slice(11)) + '</div></div>';
    }
    if (r.oneoff && r.date) {
      h += '<div class="due">原定日期：' + esc(r.date) +
        '（會一直顯示到有人標記完成）</div>';
    }
    if (state.auth) {
      if (r.oneoff) {
        h += '<button class="primary" style="margin-bottom:7px" ' +
          'onclick="finishOneoff(\'' + esc(r.id) + '\')">✓ 標記完成</button>';
      }
      h += (undone
        ? '<button class="ghost" onclick="cancelReport(' + i + ')">取消回報</button>'
        : '<button class="ghost" onclick="openReport(' + i + ')">回報未能完成</button>');
    }
    h += '</div>';
  }
  return h + '</div>';
}
/* ---------- 活動 ---------- */

/**
 * 首頁活動段。
 * ⚠️ 唔可以用 renderToday 開頭嗰種「掟走成個 main() 出 loading」嘅寫法 ——
 *    咁會連今日工作都唔見咗。呢度只喺自己呢一段出 loading，其餘照顯示。
 *    eventsLoading 做 in-flight 標記，擋住每次 render 都再叫多次 API。
 */
function eventsSection() {
  if (!state.events) {
    if (!state.eventsLoading) {
      state.eventsLoading = true;
      call('getEvents', authPayload()).then(function (d) {
        state.events = d;
        state.eventsLoading = false;
        renderIfEvtView_();
      }).catch(function (e) {
        state.eventsLoading = false;
        state.events = { error: e.message, upcoming: [], past: [] };
        renderIfEvtView_();
      });
    }
    return '<div class="section-label">' + t('evtSection') + '</div><div class="loading">' + t('loading') + '</div>';
  }

  var d = state.events;
  if (d.error) {
    return '<div class="section-label">' + t('evtSection') + '</div>' +
      '<div class="empty">' + t('loadFail') + esc(d.error) +
      '<br><br><button class="ghost" onclick="reloadEvents()">' + t('retry') + '</button></div>';
  }

  var up = d.upcoming || [];
  /* 一個活動都冇就唔佔位 —— 但管理層要留返個「新增活動」掣，
     唔係第一個活動永遠都開唔到。 */
  if (!up.length && !(d.past || []).length && !d.canEdit) return '';

  /* 未回覆排最前 —— 呢啲係要人做嘢嘅 */
  var pending = up.filter(function (e) { return e.needRsvp && e.invited && !e.myRsvp && e.status === '公開'; });
  var rest = up.filter(function (e) { return pending.indexOf(e) === -1; });

  var h = '<div class="section-label">' + t('evtSection') +
    (pending.length ? ' <span class="cnt2">' + pending.length + '</span>' : '') + '</div>';

  if (d.canEdit) {
    h += '<button class="repairbtn" onclick="openEventEditor(\'__new__\')">＋ 新增活動' +
      (state.eventEditId === '__new__' ? ' ✕' : '') + '</button>';
    if (state.eventEditId === '__new__') h += renderEventEditor('__new__');
    h += '<button class="repairbtn" onclick="openCatEdit()">✎ 編輯活動類別' +
      (state.evtCatOpen ? ' ✕' : '') + '</button>';
    if (state.evtCatOpen) h += evtCatPanel();
  }

  pending.forEach(function (e) { h += eventCard(e); });
  rest.forEach(function (e) { h += eventCard(e); });

  if ((d.past || []).length) {
    h += '<details class="rota"' + (state.eventPastOpen ? ' open' : '') +
      ' ontoggle="state.eventPastOpen=this.open"><summary>' + t('evtPast') +
      ' <span class="cnt2">' + d.past.length + '</span></summary>';
    d.past.forEach(function (e) { h += eventCard(e); });
    h += '</details>';
  }
  return h;
}

/** 活動卡喺首頁同日曆兩處都會出現，所以所有活動 handler 都要 render 返
 *  當前嗰頁，唔可以寫死 renderToday —— 唔係喺日曆撳一下就會彈返首頁。 */
function renderEvtView() { if (state.tab === 'cal') renderCal(); else renderToday(); }

/**
 * API 返嚟之後重畫活動畫面。
 * ⚠️ 一定要兩個 tab 都認 —— 之前呢啲 callback 淨係寫 `if (state.tab === 'today')`，
 *    喺日曆頁撳「查看回覆狀況」個「載入中」就會一直轉，要撳去第二頁再返嚟
 *    先出到嚟（資料其實一早到咗，純粹冇人叫重畫）。
 * 揀走咗去公家弓／物資嗰啲頁就唔好重畫，唔係會掟走緊睇緊嗰版。
 */
function renderIfEvtView_() {
  if (state.tab === 'today' || state.tab === 'cal') renderEvtView();
}

/* 類別顏色：類別數量係可變嘅（館長改得），所以唔可以寫死 CSS token。
   改為按類別喺清單入面嘅次序循環用呢個調色盤。
   朱色（--shu）排最後，因為佢喺其他地方代表警告，唔想第一個類別就撞。 */
var CAT_COLORS = ['#27476E', '#49714F', '#B8912D', '#6B5B8E', '#B8432D', '#6E675B'];

function catColor(cat) {
  var all = (state.events && state.events.allCats) || [];
  var i = all.indexOf(cat);
  if (i < 0) return '#6E675B';        // 唔喺現行清單（例如館長刪走咗）就用中性色
  return CAT_COLORS[i % CAT_COLORS.length];
}

function catPill(cat) {
  if (!cat) return '';
  var c = catColor(cat);
  return '<span class="tag cat" style="color:' + c + ';border-color:' + c + '">' + esc(cat) + '</span>';
}

function eventCard(e) {
  var open = state.eventOpenId === e.id;
  var going = e.myRsvp === '參加';
  var pending = e.needRsvp && e.invited && !e.myRsvp && e.status === '公開';
  var cls = 'card duty evt' + (pending ? ' pending' : '') + (going ? ' going' : '');

  var when = (e.date ? esc(dmy_(e.date)) : '') + (e.time ? ' ' + esc(e.time) : '');
  var sub = [when, e.place ? esc(e.place) : ''].filter(function (x) { return x; }).join('　·　');

  /* 類別同狀態係兩粒獨立嘅 pill，可以同時出現 */
  var pill = '';
  if (e.status === '取消') pill = '<span class="tag">' + t('evtCancelled') + '</span>';
  else if (e.status === '草稿') pill = '<span class="tag">草稿</span>';
  else if (!e.needRsvp) pill = '<span class="tag">' + t('evtNotice') + '</span>';
  else if (going) pill = '<span class="tag ok">' + t('evtGoing') + '</span>';
  else if (e.myRsvp) pill = '<span class="tag">' + t('evtDecline') + '</span>';

  var h = '<div class="' + cls + '">' +
    '<div class="duty-top tap" onclick="toggleEvent(\'' + esc(e.id) + '\')">' +
    '<div class="duty-name">' + esc(e.name) +
    (sub ? '<div class="note">' + sub + '</div>' : '') + '</div>' +
    catPill(e.cat) +
    pill +
    (e.link ? '<a class="linkbtn" href="' + esc(e.link) + '" target="_blank" rel="noopener" ' +
      'onclick="event.stopPropagation()">開啟 ↗</a>' : '') +
    '<span class="caret' + (open ? ' up' : '') + '">⌄</span>' +
    '</div>';

  if (open) {
    h += '<div class="duty-more">';
    if (e.detail) h += '<div class="note" style="margin-bottom:8px">' + esc(e.detail) + '</div>';
    var kv = [];
    var add = function (label, val) {
      if (val === '' || val == null) return;
      kv.push('<div><span class="k">' + label + '</span>' + val + '</div>');
    };
    if (e.date) add(t('evtWhen'), esc(dmy_(e.date)) + (e.time ? ' ' + esc(e.time) : ''));
    if (e.place) add(t('evtWhere'), esc(e.place));
    if (e.host) add(t('evtHost'), esc(e.host));
    if (e.fee) add(t('evtFee'), esc(e.fee));
    if (e.deadline) add(t('evtDeadline'), esc(dmy_(e.deadline)));
    if (e.needRsvp) {
      add(t('evtGoing'), e.yes + (e.cap ? ' / ' + e.cap : ''));
      add(t('evtDecline'), String(e.no));
    } else if (e.cap) {
      add(t('evtCap'), String(e.cap));
    }
    if (kv.length) h += '<div class="evt-kv">' + kv.join('') + '</div>';

    if (e.needRsvp && e.status === '公開') {
      /* 過咗嘅活動一律唔畀改回覆（後端 saveRsvp 都有同一個閘）——
         事後「邊個真係到咗」係組長剔嘅記錄，唔係當事人自己改回覆。 */
      var over = e.date && e.date < (state.events.today || '');
      var closed = e.deadline && e.deadline < (state.events.today || '');
      var full = e.cap > 0 && e.yes >= e.cap && !going;
      if (!e.invited) {
        h += '<p class="svc-hint">你唔喺呢個活動嘅邀請名單，睇得但唔使回覆。</p>';
      } else if (over) {
        h += '<p class="svc-hint">' + t('evtOver') + '</p>';
      } else if (closed) {
        h += '<p class="svc-hint">' + t('evtClosed') + '（' + esc(dmy_(e.deadline)) + '）</p>';
      } else {
        h += '<div class="rsvp-row">' +
          '<button class="' + (going ? 'primary' : 'ghost') + '" ' +
          'onclick="doRsvp(\'' + esc(e.id) + '\',\'參加\')"' + (full ? ' disabled' : '') + '>' +
          (going ? '✓ ' : '') + t('evtJoin') + '</button>' +
          '<button class="' + (e.myRsvp === '唔參加' ? 'primary' : 'ghost') + '" ' +
          'onclick="doRsvp(\'' + esc(e.id) + '\',\'唔參加\')">' +
          (e.myRsvp === '唔參加' ? '✓ ' : '') + t('evtDecline') + '</button></div>';
        if (full) h += '<p class="svc-hint">' + t('evtFull') + '</p>';
      }
      h += eventRosterHtml_(e.id);
    }

    if (state.events.canEdit) {
      h += '<div class="edit-row" style="margin-top:10px">' +
        '<button class="ghost" onclick="openEventEditor(\'' + esc(e.id) + '\')">✎ 編輯</button>' +
        (e.status === '取消'
          ? '<button class="ghost" onclick="setEvtStatus(\'' + esc(e.id) + '\',\'公開\')">↩ 恢復</button>'
          : '<button class="danger" onclick="setEvtStatus(\'' + esc(e.id) + '\',\'取消\')">取消活動</button>') +
        '</div>';
      if (state.eventEditId === e.id) h += renderEventEditor(e.id);
    }
    h += '</div>';
  }
  return h + '</div>';
}

/* ---------- 活動編輯器（副組長以上） ---------- */

/** 開／關編輯器。開嗰陣由活動 clone 一份草稿出嚟。 */
function openEventEditor(id) {
  if (state.eventEditId === id) { state.eventEditId = null; state.evtBuilder = null; return renderEvtView(); }
  var e = null;
  if (id !== '__new__') {
    e = (state.events.upcoming || []).concat(state.events.past || [])
      .filter(function (x) { return x.id === id; })[0];
  }
  state.eventEditId = id;
  /* ⚠️ 兩個分支要一齊改 —— 新欄位漏咗其中一邊就會變 undefined */
  state.evtBuilder = e ? {
    name: e.name, cat: e.cat || '', date: e.date, time: e.time, place: e.place, detail: e.detail,
    deadline: e.deadline, cap: e.cap || '', fee: e.fee, host: e.host, link: e.link,
    needRsvp: e.needRsvp, status: e.status,
    viewRoles: (e.viewRoles || []).slice(), viewTags: (e.viewTags || []).slice(),
    inviteRoles: (e.inviteRoles || []).slice(), inviteTags: (e.inviteTags || []).slice()
  } : {
    name: '', cat: '', date: '', time: '', place: '', detail: '',
    deadline: '', cap: '', fee: '', host: '', link: '',
    needRsvp: true, status: '公開',
    viewRoles: [], viewTags: [], inviteRoles: [], inviteTags: []
  };
  renderEvtView();
}
function closeEventEditor() { state.eventEditId = null; state.evtBuilder = null; renderEvtView(); }

/**
 * ⚠️ 每次 re-render 之前一定要行呢個。
 * 啲 input 係 uncontrolled（值淨係喺 DOM 度），撳一個 toggle 掣就會重畫成段 HTML，
 * 唔先抽返入 state 嘅話，用戶打咗一半嘅字會即刻消失。rota editor 個 syncEditor() 就係為咗同一件事。
 */
function syncEventEditor() {
  var b = state.evtBuilder;
  if (!b) return;
  [['evName', 'name'], ['evDate', 'date'], ['evTime', 'time'], ['evPlace', 'place'],

/* ---------- 日曆 ---------- */

/** 'yyyy-MM' → {y, m}（m 係 1-12） */
function calYM_() {
  var p = String(state.calMonth || '').split('-');
  if (p.length !== 2) {
    var t0 = (state.events && state.events.today) || '';
    p = t0 ? t0.slice(0, 7).split('-') : [String(new Date().getFullYear()), String(new Date().getMonth() + 1)];
  }
  return { y: Number(p[0]), m: Number(p[1]) };
}
function calShift(n) {
  var ym = calYM_();
  var d = new Date(ym.y, ym.m - 1 + n, 1);
  var mo = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  state.calMonth = mo;
  /* 揀咗嗰日要跟住轉月 —— 唔係嘅話格仔換咗做上個月，下面張詳情卡仲係
     停喺原本嗰日，睇落好似成個月曆都冇郁過。回到當月就跳返今日。 */
  var today = (state.events && state.events.today) || '';
  state.calDay = (today.slice(0, 7) === mo) ? today : mo + '-01';
  renderCal();
}
function calPick(day) { state.calDay = day; renderCal(); }
function calFilter(c) { state.calCat = c; renderCal(); }

var EN_MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/** 前／後 n 個月嘅短名，寫喺揀月掣上面 */
function calMonLabel_(n) {
  var ym = calYM_();
  var d = new Date(ym.y, ym.m - 1 + n, 1);
  return state.lang === 'en' ? EN_MON[d.getMonth()] : (d.getMonth() + 1) + '月';
}
function calTitle_(ym) {
  return state.lang === 'en'
    ? EN_MON[ym.m - 1] + ' ' + ym.y
    : ym.y + ' 年 ' + ym.m + ' 月';
}
/** 撳月份標題跳返今個月／今日 */
function calToday() {
  var today = (state.events && state.events.today) || '';
  if (!today) return;
  state.calMonth = today.slice(0, 7);
  state.calDay = today;
  renderCal();
}

/** 所有睇得到嘅活動，已套用類別篩選 */
function calEvents_() {
  var d = state.events || {};
  var all = (d.upcoming || []).concat(d.past || []);
  if (!state.calCat) return all;
  return all.filter(function (e) { return e.cat === state.calCat; });
}

function renderCal() {
  if (!state.events) {
    if (!state.eventsLoading) {
      state.eventsLoading = true;
      call('getEvents', authPayload()).then(function (d) {
        state.events = d; state.eventsLoading = false;
        renderIfEvtView_();
      }).catch(function (e) {
        state.eventsLoading = false;
        state.events = { error: e.message, upcoming: [], past: [] };
        renderIfEvtView_();
      });
    }
    main().innerHTML = '<div class="loading">' + t('loading') + '</div>';
    return;
  }

  var d = state.events;
  if (d.error) {
    main().innerHTML = '<div class="empty">' + t('loadFail') + esc(d.error) +
      '<br><br><button class="ghost" onclick="reloadEvents()">' + t('retry') + '</button></div>';
    return;
  }

  var today = d.today || '';
  if (!state.calMonth) state.calMonth = today.slice(0, 7);
  if (!state.calDay) state.calDay = today;

  var ym = calYM_();
  var list = calEvents_();

  /* 一個月一次過分好組，好過每格都掃一次成個清單 */
  var byDay = {};
  list.forEach(function (e) {
    if (!e.date) return;
    (byDay[e.date] = byDay[e.date] || []).push(e);
  });

  var h = '';

  /* 類別篩選 */
  if ((d.allCats || []).length) {
    h += '<div class="chips">' +
      '<button class="chip-btn' + (!state.calCat ? ' on' : '') + '" onclick="calFilter(\'\')">' +
      t('calAll') + '</button>' +
      d.allCats.map(function (c) {
        var on = state.calCat === c;
        var css = on ? 'background:' + catColor(c) + ';border-color:' + catColor(c)
                     : 'color:' + catColor(c) + ';border-color:' + catColor(c);
        return '<button class="chip-btn' + (on ? ' on' : '') + '" style="' + css + '" ' +
          'onclick="calFilter(\'' + esc(c) + '\')">' + esc(c) + '</button>';
      }).join('') + '</div>';
  }

  /* 月份標題 + 前後掣 */
  /* 掣上面直接寫住前後嗰個月份 —— 淨係得個 ‹ › 箭嘴喺手機上面太細，
     睇唔出撳得，亦都撳唔中（用戶回報「撳 ‹ 完全冇反應」）。 */
  h += '<div class="cal-head">' +
    '<button class="ghost" onclick="calShift(-1)">‹ ' + calMonLabel_(-1) + '</button>' +
    '<div class="cal-title" onclick="calToday()">' + calTitle_(ym) + '</div>' +
    '<button class="ghost" onclick="calShift(1)">' + calMonLabel_(1) + ' ›</button></div>';

  /* 格仔 */
  var wd = t('calWd').split(',');
  h += '<div class="cal-grid">' + wd.map(function (w) {
    return '<div class="cal-wd">' + esc(w) + '</div>';
  }).join('');

  var first = new Date(ym.y, ym.m - 1, 1).getDay();      // 0 = 星期日
  var days = new Date(ym.y, ym.m, 0).getDate();
  for (var i = 0; i < first; i++) h += '<div class="cal-day empty"></div>';
  for (var dd = 1; dd <= days; dd++) {
    var key = ym.y + '-' + ('0' + ym.m).slice(-2) + '-' + ('0' + dd).slice(-2);
    var evs = byDay[key] || [];
    var cls = 'cal-day' + (key === today ? ' today' : '') + (key === state.calDay ? ' sel' : '');
    h += '<div class="' + cls + '" onclick="calPick(\'' + key + '\')">' +
      '<div>' + dd + '</div><div class="cal-dots">' +
      evs.slice(0, 3).map(function (e) {
        return '<span class="cal-dot" style="background:' + catColor(e.cat) + '"></span>';
      }).join('') +
      (evs.length > 3 ? '<span class="cal-more">+</span>' : '') +
      '</div></div>';
  }
  h += '</div>';

  /* 揀咗嗰日 */
  var sel = byDay[state.calDay] || [];
  h += '<div class="section-label">' + esc(dmy_(state.calDay)) +
    (sel.length ? ' <span class="cnt2">' + sel.length + '</span>' : '') + '</div>';
  if (!sel.length) h += '<div class="empty">' + t('calNoEvent') + '</div>';
  else sel.forEach(function (e) { h += eventCard(e); });

  h += '<div class="ver">' + APP_VERSION + '</div>';
  main().innerHTML = h;
}

/* svcToggle 撳一下 checkbox 就會令成個表重畫（renderToday/renderStats
   係成個 innerHTML 掟晒佢重嚟），所以重畫之前要摷起「其他／備註／代登記
   編號」呢三格入面已經打咗嘅字，唔係就會歸晒零 —— 呢三格淨係喺 DOM 度
   存在，冇存落 state，之前試過打咗代登記編號再撳 checkbox 就清晒。 */
function svcToggle(item, checked) {
  state.svcOtherVal = val('svcOther');
  state.svcNoteVal = val('svcNote');
  state.svcForVal = val('svcFor');
  if (item === '不需要維修' && checked) state.svcSel = {};   // 互斥：清走其他
  if (checked) {
    if (item !== '不需要維修') delete state.svcSel['不需要維修'];
    state.svcSel[item] = true;
  } else {
    delete state.svcSel[item];
  }
  if (state.svcFrom === 'today') renderToday(); else renderStats();
}

function openReport(i) {
  var r = state.publicData.todayDuties[i];
  var reason = prompt('「' + r.item + '」今日未能完成，原因？\n（例如：物資不足、時間不夠、器具壞咗）');
  if (reason === null) return;
  if (!String(reason).trim()) return toast('請填原因');
  toast('回報中…');
  call('reportTaskStatus', authPayload(), r.item, '未能完成', String(reason).trim())
    .then(function (res) {
      if (!res.ok) return toast(res.msg);
      toast('已回報');
      state.dutyOpen = null;
      reloadPublic();
    }).catch(function (e) { toast('失敗：' + e.message); });
}
function cancelReport(i) {
  var r = state.publicData.todayDuties[i];
  if (!confirm('取消「' + r.item + '」嘅未能完成回報？')) return;
  call('reportTaskStatus', authPayload(), r.item, '取消回報', '')
    .then(function (res) {
      if (!res.ok) return toast(res.msg);
      toast('已取消回報');
      state.dutyOpen = null;
      reloadPublic();
    }).catch(function (e) { toast('失敗：' + e.message); });
}

function finishOneoff(id) {
  if (!confirm('確認呢項臨時工作已經完成？')) return;
  toast('更新中…');
  call('completeOneoff', authPayload(), id, true).then(function (r) {
    if (!r.ok) return toast(r.msg);
    toast('已標記完成');
    state.dutyOpen = null;
    reloadPublic();
  }).catch(function (e) { toast('失敗：' + e.message); });
}
function undoOneoff(id) {
  call('completeOneoff', authPayload(), id, false).then(function (r) {
    if (!r.ok) return toast(r.msg);
    toast('已取消完成');
    reloadPublic();
  }).catch(function (e) { toast('失敗：' + e.message); });
}

function openSettings() {
  state.rotaOpen = true; state.rotaEdit = true; state.showSettings = true;
  renderToday();
  setTimeout(function () {
    var el = document.getElementById('setBox');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 60);
}
function saveRollCall() {
  var url = val('scUrl'), label = val('scLabel');
  if (url && !/^https?:\/\//i.test(url)) return toast('連結要以 http:// 或 https:// 開頭');
  toast('儲存中…');
  call('updateSetting', authPayload(), '點名連結', url).then(function (r) {
    if (!r.ok) return toast(r.msg);
    return call('updateSetting', authPayload(), '點名按鈕名稱', label || '點名');
  }).then(function (r) {
    if (r && !r.ok) return toast(r.msg);
    toast('已儲存');
    reloadPublic();
  }).catch(function (e) { toast('失敗：' + e.message); });
}
